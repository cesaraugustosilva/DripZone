services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dripzone}
      POSTGRES_USER: ${POSTGRES_USER:-dripzone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD deve ser definido}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - dripzone_postgres_data:/var/lib/postgresql/data
    networks:
      - dripzone_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-DripZone Admin API}
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      APP_DEBUG: "false"
      API_PREFIX: /api
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL deve apontar para PostgreSQL interno com senha URL-encoded}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?SESSION_SECRET_KEY deve ser definido}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dripzone_admin_session}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-28800}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS deve listar origens de producao}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      UPLOAD_DIRECTORY: /app/storage/uploads
      PUBLIC_PRODUCTS_PATH: /app/public-data/products.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-5242880}
      ALLOWED_IMAGE_TYPES: ${ALLOWED_IMAGE_TYPES:-image/jpeg,image/png,image/webp}
    volumes:
      - dripzone_uploads:/app/storage/uploads
      - ./frontend/data:/app/public-data
    networks:
      - dripzone_internal
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/status', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    environment:
      APP_NAME: ${APP_NAME:-DripZone Admin API}
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      APP_DEBUG: "false"
      API_PREFIX: /api
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL deve apontar para PostgreSQL interno com senha URL-encoded}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?SESSION_SECRET_KEY deve ser definido}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dripzone_admin_session}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-28800}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS deve listar origens de producao}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      UPLOAD_DIRECTORY: /app/storage/uploads
      PUBLIC_PRODUCTS_PATH: /app/public-data/products.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-5242880}
      ALLOWED_IMAGE_TYPES: ${ALLOWED_IMAGE_TYPES:-image/jpeg,image/png,image/webp}
    volumes:
      - dripzone_uploads:/app/storage/uploads
      - ./frontend/data:/app/public-data
    networks:
      - dripzone_internal
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DRIPZONE_SITE_ADDRESS: ${DRIPZONE_SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv/frontend:ro
      - dripzone_uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dripzone_internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  dripzone_internal:
    driver: bridge

volumes:
  dripzone_postgres_data:
  dripzone_uploads:
  caddy_data:
  caddy_config:
